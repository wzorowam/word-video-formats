<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>agent — terminal</title>
  <style>
    html, body { margin: 0; background: #000; height: 100%; }
    body { display: grid; place-items: center; }
    canvas { width: min(100vw, calc(100vh * 1080 / 1920)); height: auto; display: block; }
  </style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

const LOOP = 15;
const KEYS = [
  { ch: "a", t: 0.92 },
  { ch: "g", t: 1.14 },
  { ch: "e", t: 1.38 },
  { ch: "n", t: 1.66 },
  { ch: "t", t: 1.90 },
];
const ENTER = 2.32;
const BOOT = [
  { t: 2.62, kind: "version" },
  { t: 3.28, kind: "model" },
  { t: 3.96, kind: "session" },
];
const WIPE_0 = 4.70;
const WIPE_1 = 5.60;
const UI_0 = 5.60;

const C = {
  term: "#0a0a0a",
  grok: "#141414",
  bar: "#1a1a1c",
  hair: "#2a2a2e",
  fg: "#e1e1e1",
  fg2: "#c8c8c8",
  dim: "#6c6c6c",
  dimmer: "#585858",
  key: "#787878",
  green: "#9ece6a",
  blue: "#7aa2f7",
  teal: "#1abc9c",
  cyan: "#7dcfff",
  red: "#f7768e",
  border: "#323237",
  borderOn: "#505058",
  dotR: "#ff5f57",
  dotY: "#febc2e",
  dotG: "#28c840",
};

const LOGO = [
  "⠀⠀⠀⠀⠀⠀⣀⣀⡀⠀⠀⠀⢀⠄",
  "⠀⠀⠀⣠⣾⠿⠛⠛⠛⠛⢀⡴⠁⠀",
  "⠀⠀⣼⡟⠁⠀⠀⠀⢀⡴⠻⣿⡀⠀",
  "⠀⠀⣿⡇⠀⠀⠀⠔⠁⠀⠀⣿⡇⠀",
  "⠀⠀⢹⣷⠀⠀⠀⠀⠀⢀⣴⡿⠀⠀",
  "⠀⢀⠞⠁⠠⢶⣶⣶⣶⠿⠋⠀⠀⠀",
  "⠐⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀",
];

const MENU = [
  ["New worktree", "ctrl+w"],
  ["Resume session", "ctrl+r"],
  ["Changelog", ""],
  ["Quit", "ctrl+q"],
];

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  const c = A.map((v, i) => Math.round(lerp(v, B[i], clamp(t, 0, 1))));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function shineOpacity(diag, secs) {
  const BAND = 0.38, CYCLE = 4, SWEEP = 0.32, SHINE = 0.33, PULSE = 0.06, PULSE_SECS = 5;
  const p = (secs % CYCLE) / CYCLE;
  const q = Math.min(1, p / SWEEP);
  const band = -BAND + q * (1 + 2 * BAND);
  const pulse = PULSE * (0.5 - 0.5 * Math.cos((Math.PI * 2 * secs) / PULSE_SECS));
  const d = Math.abs(diag - band);
  const shine = d < BAND ? 0.5 * (1 + Math.cos((Math.PI * d) / BAND)) : 0;
  return clamp(pulse + SHINE * shine, 0, 1);
}

function font(size, weight) {
  return `${weight || 400} ${size}px "JetBrains Mono", "DejaVu Sans Mono", monospace`;
}

function typedCount(t) {
  let n = 0;
  for (const k of KEYS) if (t >= k.t) n++;
  return n;
}

function cursorOn(t, period) {
  const p = period || 1.06;
  return (t % p) < p * 0.52;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawChrome(title, bg) {
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = C.bar;
  ctx.fillRect(0, 0, W, 88);
  ctx.fillStyle = C.hair;
  ctx.fillRect(0, 88, W, 2);
  const dots = [C.dotR, C.dotY, C.dotG];
  dots.forEach((color, i) => {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(40 + i * 28, 44, 8, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.font = font(22, 500);
  ctx.fillStyle = "#9a9aa2";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(title, W / 2, 45);
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
}

function drawShell(t, bodyOnly) {
  if (!bodyOnly) drawChrome("zsh — word-video-formats", C.term);
  else {
    ctx.fillStyle = C.term;
    ctx.fillRect(0, 90, W, H - 90);
  }
  const size = 34;
  const lh = 52;
  ctx.font = font(size, 450);
  ctx.textBaseline = "top";
  let y = 140;
  const x = 56;

  const user = "dev";
  const host = "@build";
  const path = ":~/word-video-formats";
  const sigil = "$ ";
  const n = typedCount(t);
  const word = "agent".slice(0, n);
  const entered = t >= ENTER;

  function piece(text, color) {
    ctx.fillStyle = color;
    ctx.fillText(text, xCursor, y);
    xCursor += ctx.measureText(text).width;
  }

  let xCursor = x;
  piece(user + host, C.green);
  piece(path, C.blue);
  piece(sigil, C.fg);
  piece(word, C.fg);

  const showCursor = !entered && cursorOn(Math.max(0, t), 1.06);
  if (showCursor) {
    ctx.fillStyle = C.fg2;
    ctx.fillRect(xCursor + 2, y + 4, 18, size - 2);
  }

  if (entered) {
    BOOT.forEach((line, i) => {
      if (t < line.t) return;
      const age = t - line.t;
      const slide = lerp(14, 0, smooth(age / 0.16));
      const alpha = clamp(age / 0.12, 0, 1);
      ctx.save();
      ctx.globalAlpha = alpha;
      const ly = y + lh * (i + 1) + slide;
      ctx.font = font(size, line.kind === "version" ? 650 : 450);
      if (line.kind === "version") {
        ctx.fillStyle = C.fg;
        ctx.fillText("Grok Build ", x, ly);
        const w = ctx.measureText("Grok Build ").width;
        ctx.font = font(size, 450);
        ctx.fillStyle = C.dim;
        ctx.fillText("1.0.45", x + w, ly);
      } else if (line.kind === "model") {
        ctx.fillStyle = C.dim;
        ctx.fillText("model  ", x, ly);
        const w = ctx.measureText("model  ").width;
        ctx.fillStyle = C.teal;
        ctx.fillText("grok-4.7", x + w, ly);
      } else {
        ctx.fillStyle = C.cyan;
        ctx.fillText("session start", x, ly);
      }
      ctx.restore();
    });
  }
}

function drawLogo(cx, top, secs, alpha) {
  const size = 40;
  const lh = 50;
  ctx.font = font(size, 400);
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  ctx.globalAlpha = alpha;
  const rows = LOGO.length;
  LOGO.forEach((line, row) => {
    const chars = Array.from(line);
    const cols = chars.length;
    const widths = chars.map((ch) => ctx.measureText(ch).width);
    const total = widths.reduce((a, b) => a + b, 0);
    let x = cx - total / 2;
    chars.forEach((ch, col) => {
      const diag = (col + (rows - 1 - row)) / (cols + rows);
      const op = shineOpacity(diag, secs);
      ctx.fillStyle = mix(C.dim, C.fg, op);
      ctx.fillText(ch, x + widths[col] / 2, top + row * lh);
      x += widths[col];
    });
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";
}

function drawGrok(t) {
  const u = smooth((t - UI_0) / 0.35);
  drawChrome("Grok Build", mix(C.term, C.grok, u));
  ctx.fillStyle = C.grok;
  ctx.fillRect(0, 90, W, H - 90);

  const focus = smooth((t - 7.05) / 0.40);
  const logoA = smooth((t - 5.55) / 0.35);
  drawLogo(W / 2, 168, Math.max(0, t - 5.55), logoA);

  const menuW = 640;
  const menuX = (W - menuW) / 2;
  let my = 168 + 7 * 50 + 56;
  ctx.textBaseline = "top";
  MENU.forEach((item, i) => {
    const a = smooth((t - (6.05 + i * 0.12)) / 0.22);
    if (a <= 0) return;
    ctx.globalAlpha = a;
    ctx.font = font(30, 700);
    ctx.fillStyle = C.fg;
    ctx.textAlign = "left";
    ctx.fillText(item[0], menuX, my);
    if (item[1]) {
      ctx.font = font(28, 450);
      ctx.fillStyle = C.key;
      ctx.textAlign = "right";
      ctx.fillText(item[1], menuX + menuW, my + 2);
    }
    ctx.globalAlpha = 1;
    my += 56;
  });

  const tipA = smooth((t - 6.70) / 0.25);
  ctx.globalAlpha = tipA;
  ctx.font = font(24, 450);
  ctx.fillStyle = C.dim;
  ctx.textAlign = "left";
  ctx.fillText("ctrl+p  command palette", 72, 1548);
  ctx.globalAlpha = 1;

  const boxA = smooth((t - 6.35) / 0.28);
  const bx = 56, by = 1604, bw = W - 112, bh = 148;
  ctx.globalAlpha = boxA;
  ctx.fillStyle = C.grok;
  roundRect(bx, by, bw, bh, 12);
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = mix(C.border, C.borderOn, focus);
  ctx.stroke();

  const mid = by + bh / 2;
  ctx.strokeStyle = C.fg;
  ctx.lineWidth = 3.5;
  ctx.lineJoin = "round";
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(bx + 30, mid - 16);
  ctx.lineTo(bx + 48, mid);
  ctx.lineTo(bx + 30, mid + 16);
  ctx.stroke();
  const caret = bx + 66;
  if (t >= 7.05 && cursorOn(t - 7.05, 1.06)) {
    ctx.fillStyle = C.fg2;
    ctx.fillRect(caret, mid - 18, 18, 36);
  }
  ctx.globalAlpha = 1;

  const verA = smooth((t - 6.85) / 0.25);
  ctx.globalAlpha = verA;
  ctx.textBaseline = "alphabetic";
  ctx.font = font(24, 450);
  const right = W - 56;
  const ver = "1.0.45";
  ctx.fillStyle = C.dim;
  const verW = ctx.measureText(ver).width;
  ctx.textAlign = "right";
  ctx.fillText(ver, right, 1848);
  ctx.font = font(24, 700);
  ctx.fillStyle = C.fg;
  ctx.fillText("Grok Build ", right - verW, 1848);
  ctx.font = font(24, 450);
  ctx.fillStyle = C.dimmer;
  const badgeW = ctx.measureText("Grok Build ").width + verW;
  ctx.fillText("│", right - badgeW - 8, 1848);
  const sepW = ctx.measureText("│").width;
  ctx.fillText("Logged in with API key", right - badgeW - 8 - sepW - 16, 1848);
  ctx.globalAlpha = 1;
  ctx.textAlign = "left";

  ctx.font = font(22, 450);
  ctx.fillStyle = C.dimmer;
  ctx.fillText("~/word-video-formats", 56, 132);
}

function drawAt(t) {
  ctx.clearRect(0, 0, W, H);
  if (t < WIPE_0) {
    drawShell(t);
    return;
  }
  if (t < WIPE_1) {
    const p = smooth((t - WIPE_0) / (WIPE_1 - WIPE_0));
    drawChrome(p > 0.55 ? "Grok Build" : "zsh — word-video-formats", mix(C.term, C.grok, p));
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 90, W, H - 90);
    ctx.clip();
    ctx.fillStyle = C.grok;
    ctx.fillRect(0, 90, W, H - 90);
    ctx.translate(0, -p * 340);
    drawShell(WIPE_0, true);
    ctx.restore();
    return;
  }
  drawGrok(t);
}

let t0 = performance.now();
function playbackTime() {
  if (window.__t != null) return window.__t;
  return ((performance.now() - t0) / 1000) % LOOP;
}

function frame() {
  drawAt(playbackTime());
  if (window.__t == null) requestAnimationFrame(frame);
}

window.__renderAt = (t) => {
  window.__t = t;
  drawAt(t);
};

document.fonts.load('34px "JetBrains Mono"').then(() => {
  window.__ready = true;
  frame();
});
</script>
</body>
</html>
